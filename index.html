<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0d12">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Place & Sky Telemetry</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <style>
        :root {
            --bg-base: #0a0d12;
            --silver-surface: linear-gradient(145deg, #64748b 0%, #334155 100%);
            --silver-border: rgba(241, 245, 249, 0.45);
            --silver-border-specular: rgba(255, 255, 255, 0.15);
            --text-silver-bright: #ffffff;
            --text-silver-dim: #e2e8f0;
            --text-silver-label: #f8fafc;
            --accent-cyan: #38bdf8;
            --bright-green: #39ff14; 
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%; 
            height: 100vh;
            background: var(--bg-base);
            color: var(--text-silver-bright);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            overflow: hidden; 
        }

        .app-container {
            width: 100%;
            max-width: 650px; 
            height: 100vh;
            margin: 0 auto;
            overflow-y: auto;
            overscroll-behavior-y: contain; 
            padding: env(safe-area-inset-top) 8px calc(env(safe-area-inset-bottom) + 16px) 8px;
        }

        .header-banner {
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            border-radius: 16px;
            padding: 24px 14px;
            text-align: center;
            font-weight: 800;
            font-size: 24px;
            letter-spacing: 0.5px;
            color: #ffffff;
            box-shadow: 0 4px 18px rgba(56, 189, 248, 0.28);
            margin-bottom: 16px;
        }

        .section-label {
            text-align: center;
            color: var(--text-silver-dim);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            margin: 16px 0 10px 0;
        }

        .card {
            background: var(--silver-surface);
            border: 1px solid var(--silver-border);
            box-shadow: inset 0 1px 1px var(--silver-border-specular), 0 4px 12px rgba(0, 0, 0, 0.5);
            border-radius: 14px;
            padding: 12px 14px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px; 
            margin-bottom: 8px;
        }

        .full-width {
            margin-bottom: 8px;
        }

        .label {
            font-size: 10px;
            font-weight: 700;
            color: var(--text-silver-label);
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .val {
            font-size: 16.5px;
            font-weight: 700;
            color: var(--text-silver-bright);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .heading-cell {
            position: relative;
            cursor: pointer;
        }

        .compass-arrow {
            position: absolute;
            right: 12px;
            top: calc(50% - 13px);
            width: 26px;
            height: 26px;
            transition: transform 0.1s cubic-bezier(0.1, 0.9, 0.2, 1);
            filter: drop-shadow(0 0 6px rgba(57, 255, 20, 0.8));
        }

        /* Responsive Map Box - Allows internal script to calculate its own size */
        .map-wrapper {
            width: 100%;
            aspect-ratio: 2 / 1; 
            border-radius: 14px;
            overflow: hidden;
            background: #0f131a;
            border: 1px solid var(--silver-border);
            margin-bottom: 12px;
            position: relative;
        }

        .map-iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%; 
            height: 100%; 
            border: none;
            pointer-events: none; 
        }

        .scrollable-events {
            max-height: 160px;
            overflow-y: auto;
            overscroll-behavior-y: contain; 
            padding-right: 4px;
        }

        .scrollable-events::-webkit-scrollbar { width: 4px; }
        .scrollable-events::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 4px;
        }

        .events-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .event-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.2);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            text-decoration: none;
            color: inherit;
            cursor: pointer;
        }

        .event-date {
            color: var(--accent-cyan);
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
            margin-right: 8px;
        }

        .event-name {
            color: var(--text-silver-bright);
            font-size: 13px;
            font-weight: 500;
            flex-grow: 1;
            text-align: right;
        }

        /* IN-APP BROWSER OVERLAY */
        #browserOverlay {
            display: none; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100vw; height: 100vh; 
            background: var(--bg-base); 
            z-index: 9999; 
            flex-direction: column;
        }

        .browser-header {
            height: calc(env(safe-area-inset-top) + 60px); 
            padding: env(safe-area-inset-top) 15px 0 15px; 
            background: #1e293b; 
            display: flex; 
            align-items: center; 
            border-bottom: 1px solid #334155;
        }

        .browser-back-btn {
            background: var(--accent-cyan); 
            color: #fff; 
            border: none; 
            padding: 8px 16px; 
            border-radius: 8px; 
            font-weight: bold; 
            font-size: 15px;
            cursor: pointer;
        }

        .browser-title {
            margin-left: 15px; 
            font-weight: bold; 
            color: #fff; 
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #browserFrame {
            flex-grow: 1; 
            width: 100%; 
            border: none;
            background: #ffffff;
        }
    </style>
</head>
<body>

    <!-- IN-APP BROWSER MODAL -->
    <div id="browserOverlay">
        <div class="browser-header">
            <button class="browser-back-btn" onclick="closeBrowser()">← Back</button>
            <span class="browser-title" id="browserTitle">Loading...</span>
        </div>
        <iframe id="browserFrame" src=""></iframe>
    </div>

    <!-- MAIN APP DASHBOARD -->
    <div class="app-container">
        <div class="header-banner">Your Place Data</div>

        <div class="card full-width">
            <div class="label">Digipin</div>
            <div class="val" id="digipinVal" style="letter-spacing: 1.5px;">M C 2 5 M 5 5 4 8 M</div>
        </div>

        <div class="grid-2">
            <div class="card">
                <div class="label">Longitude</div>
                <div class="val" id="lonVal">76.224575° E</div>
            </div>
            <div class="card">
                <div class="label">Latitude</div>
                <div class="val" id="latVal">10.545894° N</div>
            </div>
        </div>

        <div class="grid-2">
            <div class="card">
                <div class="label">Elevation</div>
                <div class="val" id="altVal">21 m</div>
            </div>
            <div class="card heading-cell" id="headingBtn" onclick="requestCompassPermission()">
                <div class="label">Heading</div>
                <div class="val" id="headingVal">307°</div>
                <svg class="compass-arrow" id="compassArrow" viewBox="0 0 24 24" fill="none">
                    <polygon points="12,3 17,21 12,16 7,21" fill="var(--bright-green)" stroke="var(--bright-green)" stroke-width="1.2"/>
                    <text x="12" y="3" font-size="5" fill="var(--bright-green)" text-anchor="middle" font-weight="900" font-family="sans-serif">N</text>
                </svg>
            </div>
        </div>

        <div class="grid-2">
            <div class="card">
                <div class="label">Accuracy</div>
                <div class="val" id="accVal">± 6 m</div>
            </div>
            <div class="card">
                <div class="label">Date</div>
                <div class="val" id="dateVal">07 Oct 2026</div>
            </div>
        </div>

        <div class="grid-2">
            <div class="card">
                <div class="label">Speed</div>
                <div class="val" id="speedVal">0.0 Km/h</div>
            </div>
            <div class="card">
                <div class="label">Time</div>
                <div class="val" id="timeVal">--:--:--</div>
            </div>
        </div>

        <!-- Auto-Scaling Live Map -->
        <div class="map-wrapper" id="mapContainer">
            <iframe class="map-iframe" 
                    id="mapFrame"
                    src="https://www.timeanddate.com/scripts/sunmap.php" 
                    scrolling="no"></iframe>
        </div>

        <div class="section-label">Sky Data</div>

        <div class="grid-2">
            <div class="card">
                <div class="label">Sunrise</div>
                <div class="val" id="sunriseVal">--:--</div>
            </div>
            <div class="card">
                <div class="label">Sunset</div>
                <div class="val" id="sunsetVal">--:--</div>
            </div>
        </div>

        <div class="grid-2">
            <div class="card">
                <div class="label">Moonrise</div>
                <div class="val" id="moonriseVal">--:--</div>
            </div>
            <div class="card">
                <div class="label">Moonset</div>
                <div class="val" id="moonsetVal">--:--</div>
            </div>
        </div>

        <div class="grid-2">
            <div class="card">
                <div class="label">Moon Phase</div>
                <div class="val" id="moonPhaseVal">--</div>
            </div>
            <div class="card">
                <div class="label">Day Length</div>
                <div class="val" id="dayLengthVal">--</div>
            </div>
        </div>

        <div class="section-label">Sky Events</div>
        <div class="card full-width scrollable-events">
            <div class="events-list" id="eventsList"></div>
        </div>
    </div>

    <script>
        // 1. Compass Engine
        let currentLat = 10.545894;
        let currentLon = 76.224575;
        let smoothedHeading = 0;
        const EMA_ALPHA = 0.18; 

        function handleOrientation(e) {
            let heading = e.webkitCompassHeading !== undefined ? e.webkitCompassHeading : (e.alpha !== null ? 360 - e.alpha : null);
            if (heading !== null) {
                let diff = heading - smoothedHeading;
                while (diff < -180) diff += 360;
                while (diff > 180) diff -= 360;
                smoothedHeading = (smoothedHeading + EMA_ALPHA * diff + 360) % 360;
                const rounded = Math.round(smoothedHeading);
                document.getElementById('headingVal').textContent = `${rounded}°`;
                document.getElementById('compassArrow').style.transform = `rotate(${-rounded}deg)`;
            }
        }

        function requestCompassPermission() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(state => {
                    if (state === 'granted') window.addEventListener('deviceorientation', handleOrientation, true);
                }).catch(console.error);
            } else {
                window.addEventListener('deviceorientation', handleOrientation, true);
            }
        }

        // 2. Solar/Lunar Mathematical Engine
        function calculateSkyMetrics(lat, lon, date = new Date()) {
            const rad = Math.PI / 180;
            const dayOfYear = Math.floor((date - new Date(date.getFullYear(), 0, 0)) / 86400000);
            const declination = -23.44 * Math.cos((360 / 365 * (dayOfYear + 10)) * rad);
            const latRad = lat * rad, decRad = declination * rad;
            const cosH = (Math.sin(-0.833 * rad) - Math.sin(latRad) * Math.sin(decRad)) / (Math.cos(latRad) * Math.cos(decRad));
            let dayHours = cosH < -1 ? 24 : (cosH > 1 ? 0 : (2 * Math.acos(cosH) / (15 * rad)));
            
            const solarNoon = 12 + ((-date.getTimezoneOffset() / 60) - (lon / 15));
            const sunriseH = solarNoon - (dayHours / 2);
            const sunsetH = solarNoon + (dayHours / 2);

            const formatH = (h) => {
                const totalM = Math.round(((h + 24) % 24) * 60);
                return `${String(Math.floor(totalM / 60) % 24).padStart(2, '0')}:${String(totalM % 60).padStart(2, '0')}`;
            };

            const knownNewMoon = new Date('2024-01-11T11:57:00Z');
            const phaseDays = (((date.getTime() - knownNewMoon.getTime()) / 86400000) % 29.53058867 + 29.53058867) % 29.53058867;
            const phaseName = phaseDays < 3.69 ? "Waxing Crescent" : phaseDays < 11.07 ? "First Quarter" : phaseDays < 14.76 ? "Waxing Gibbous" : phaseDays < 18.45 ? "Full Moon" : phaseDays < 22.14 ? "Waning Gibbous" : phaseDays < 25.83 ? "Last Quarter" : "Waning Crescent";
            
            const moonLag = (phaseDays / 29.53) * 24;
            return {
                sunrise: formatH(sunriseH), sunset: formatH(sunsetH),
                dayLength: `${Math.floor(dayHours)}h ${Math.round((dayHours - Math.floor(dayHours)) * 60)}m`,
                moonPhase: phaseName,
                moonrise: formatH((sunriseH + moonLag) % 24), moonset: formatH((sunsetH + moonLag) % 24)
            };
        }

        function updateSkyMetrics() {
            const metrics = calculateSkyMetrics(currentLat, currentLon);
            document.getElementById('sunriseVal').textContent = metrics.sunrise;
            document.getElementById('sunsetVal').textContent = metrics.sunset;
            document.getElementById('moonriseVal').textContent = metrics.moonrise;
            document.getElementById('moonsetVal').textContent = metrics.moonset;
            document.getElementById('moonPhaseVal').textContent = metrics.moonPhase;
            document.getElementById('dayLengthVal').textContent = metrics.dayLength;
        }

        // 3. Dynamic Auto-Updating Seasonal Events Engine
        function renderDynamicEvents() {
            const container = document.getElementById('eventsList');
            container.innerHTML = '';
            
            const today = new Date();
            const currentYear = today.getFullYear();
            
            // Static month/day configurations
            const annualEvents = [
                { m: 0, d: 3, name: "Quadrantids Meteor Shower" },
                { m: 2, d: 20, name: "Vernal Equinox" },
                { m: 3, d: 22, name: "Lyrids Meteor Shower" },
                { m: 4, d: 6, name: "Eta Aquariids Meteor Shower" },
                { m: 5, d: 21, name: "Summer Solstice" },
                { m: 7, d: 12, name: "Perseids Meteor Shower" },
                { m: 8, d: 22, name: "Autumnal Equinox" },
                { m: 9, d: 21, name: "Orionids Meteor Shower" },
                { m: 10, d: 17, name: "Leonids Meteor Shower" },
                { m: 11, d: 14, name: "Geminids Peak Meteor Shower" },
                { m: 11, d: 21, name: "Winter Solstice" }
            ];

            let upcoming = [];
            annualEvents.forEach(evt => {
                let eventDate = new Date(currentYear, evt.m, evt.d);
                // If event has already passed this year, schedule for next year
                if (eventDate < today) {
                    eventDate = new Date(currentYear + 1, evt.m, evt.d);
                }
                upcoming.push({ dateObj: eventDate, name: evt.name });
            });

            // Sort chronologically and take the next 5 events
            upcoming.sort((a, b) => a.dateObj - b.dateObj);
            const nextFive = upcoming.slice(0, 5);

            nextFive.forEach(item => {
                const dateString = item.dateObj.toLocaleDateString('en-GB', { month: 'short', day: 'numeric', year: 'numeric' });
                const row = document.createElement('div');
                row.className = 'event-item';
                row.innerHTML = `<span class="event-date">${dateString}</span><span class="event-name">${item.name} ↗</span>`;
                
                // Triggers In-App Browser Modal
                row.onclick = () => openBrowser(item.name);
                container.appendChild(row);
            });
        }

        // 4. In-App Browser Overlay Controller
        function openBrowser(searchQuery) {
            const overlay = document.getElementById('browserOverlay');
            const frame = document.getElementById('browserFrame');
            const title = document.getElementById('browserTitle');
            
            // Using DuckDuckGo Lite: Fast, Zero-Telemetry, and allows iframe embedding.
            const url = `https://lite.duckduckgo.com/lite/?q=${encodeURIComponent(searchQuery + ' astronomy')}`;
            
            title.textContent = searchQuery;
            frame.src = url;
            overlay.style.display = 'flex';
        }

        function closeBrowser() {
            document.getElementById('browserOverlay').style.display = 'none';
            document.getElementById('browserFrame').src = '';
        }

        // 5. Geolocation & Timers
        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition((pos) => {
                currentLat = pos.coords.latitude; currentLon = pos.coords.longitude;
                document.getElementById('latVal').textContent = `${currentLat.toFixed(6)}° ${currentLat >= 0 ? 'N' : 'S'}`;
                document.getElementById('lonVal').textContent = `${currentLon.toFixed(6)}° ${currentLon >= 0 ? 'E' : 'W'}`;
                if (pos.coords.altitude) document.getElementById('altVal').textContent = `${Math.round(pos.coords.altitude)} m`;
                if (pos.coords.accuracy) document.getElementById('accVal').textContent = `± ${Math.round(pos.coords.accuracy)} m`;
                if (pos.coords.speed) document.getElementById('speedVal').textContent = `${(pos.coords.speed * 3.6).toFixed(1)} Km/h`;
                updateSkyMetrics();
            }, () => {}, { enableHighAccuracy: true });
        }

        setInterval(() => {
            const now = new Date();
            document.getElementById('timeVal').textContent = now.toLocaleTimeString('en-US', { hour12: true });
            document.getElementById('dateVal').textContent = now.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
        }, 1000);

        // Initialization
        window.addEventListener('load', () => {
            renderDynamicEvents(); 
            updateSkyMetrics(); 
            requestCompassPermission();
        });
    </script>
</body>
</html>
