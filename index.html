<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Telemetry & Sky Data</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta property="og:title" content="Telemetry & Sky Data">
    <meta property="og:description" content="Offline GPS and Astronomical Calculator">
    <meta property="og:image" content="preview.jpg">
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #0d0d0d; color: #fff; margin: 0; padding: 12px; }
        .panel { background: linear-gradient(180deg, #6a6a6f 0%, #222225 100%); border: 1px solid #444; border-radius: 12px; padding: 12px; margin-bottom: 12px; box-shadow: inset 0px 1px 1px rgba(255,255,255,0.2); }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        #title-bar { text-align: center; padding: 20px; font-size: 24px; font-weight: 600; text-shadow: 0px 1px 5px rgba(0,0,0,0.5); transition: background 1s ease; border-radius: 12px; margin-bottom: 12px; }
        .metric-label { font-size: 10px; color: #ccc; text-transform: uppercase; margin-bottom: 4px; }
        .metric-value { font-size: 16px; font-weight: bold; }
        #compass-panel { cursor: pointer; position: relative; }
        .compass-icon { width: 20px; height: 20px; background: #0f0; clip-path: polygon(50% 0%, 0% 100%, 50% 75%, 100% 100%); position: absolute; right: 15px; top: 15px; transform-origin: center center; transition: transform 0.1s linear; display: none; }
        .map-container { width: 100%; aspect-ratio: 2 / 1; border-radius: 12px; overflow: hidden; pointer-events: none; position: relative; background: #000; }
        .map-container iframe { width: 100%; height: 100%; border: none; }
        .sky-events-container { max-height: 160px; overflow-y: auto; padding-right: 5px; }
        .sky-events-container::-webkit-scrollbar { width: 4px; }
        .sky-events-container::-webkit-scrollbar-thumb { background: #888; border-radius: 4px; }
        .event-item { border-bottom: 1px solid #444; padding: 8px 0; font-size: 14px; }
        .event-date { color: #00e5ff; font-weight: bold; margin-right: 8px; }
    </style>
</head>
<body>
    <div id="title-bar">Your Place Data</div>
    <div class="panel"><div class="metric-label">DIGIPIN</div><div class="metric-value" id="digipin">Calculating...</div></div>
    <div class="grid-2">
        <div class="panel"><div class="metric-label">Longitude</div><div class="metric-value" id="lon">--.------°</div></div>
        <div class="panel"><div class="metric-label">Latitude</div><div class="metric-value" id="lat">--.------°</div></div>
        <div class="panel"><div class="metric-label">Elevation</div><div class="metric-value" id="ele">-- m</div></div>
        <div class="panel" id="compass-panel" onclick="activateCompass()">
            <div class="metric-label">Heading <span style="color:#0f0;">• Tap to activate</span></div>
            <div class="metric-value" id="heading">--°</div>
            <div class="compass-icon" id="compass-icon"></div>
        </div>
        <div class="panel"><div class="metric-label">Accuracy</div><div class="metric-value" id="acc">± -- m</div></div>
        <div class="panel"><div class="metric-label">Date</div><div class="metric-value" id="date">--</div></div>
        <div class="panel"><div class="metric-label">Speed</div><div class="metric-value" id="speed">0.0 Km/h</div></div>
        <div class="panel"><div class="metric-label">Time</div><div class="metric-value" id="time">--:--:--</div></div>
    </div>
    <div class="panel map-container"><iframe src="https://lanrat.github.io/day-night-map/" scrolling="no"></iframe></div>
    <div style="text-align: center; margin: 15px 0; font-weight: bold; color: #888;">Sky Data</div>
    <div class="grid-2">
        <div class="panel"><div class="metric-label">Sunrise</div><div class="metric-value" id="sunrise">--:--</div></div>
        <div class="panel"><div class="metric-label">Sunset</div><div class="metric-value" id="sunset">--:--</div></div>
        <div class="panel"><div class="metric-label">Moonrise</div><div class="metric-value" id="moonrise">--:--</div></div>
        <div class="panel"><div class="metric-label">Moonset</div><div class="metric-value" id="moonset">--:--</div></div>
        <div class="panel"><div class="metric-label">Moon Phase</div><div class="metric-value" id="moonphase">--</div></div>
        <div class="panel"><div class="metric-label">Day Length</div><div class="metric-value" id="daylength">--</div></div>
    </div>
    <div style="text-align: center; margin: 15px 0; font-weight: bold; color: #888;">Sky Events</div>
    <div class="panel"><div class="sky-events-container" id="events-list"></div></div>
    
    <script src="./suncalc.min.js"></script>
    <script>
        function updateTitleBar() {
            const hour = new Date().getHours();
            const titleBar = document.getElementById('title-bar');
            if (hour >= 5 && hour < 8) titleBar.style.background = 'linear-gradient(180deg, #ff7e5f, #feb47b)';
            else if (hour >= 8 && hour < 17) titleBar.style.background = 'linear-gradient(180deg, #4facfe, #00f2fe)';
            else if (hour >= 17 && hour < 20) titleBar.style.background = 'linear-gradient(180deg, #614385, #516395)';
            else titleBar.style.background = 'linear-gradient(180deg, #0f2027, #203a43)';
        }
        setInterval(updateTitleBar, 60000); updateTitleBar();

        setInterval(() => {
            const now = new Date();
            document.getElementById('date').innerText = now.toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'});
            document.getElementById('time').innerText = now.toLocaleTimeString('en-US');
        }, 1000);

        function initGPS() {
            let coordsFound = false;
            navigator.geolocation.watchPosition(
                (pos) => { coordsFound = true; updateTelemetry(pos.coords); },
                (err) => { console.warn("GPS Error"); },
                { enableHighAccuracy: true }
            );
            setTimeout(() => {
                if(!coordsFound) updateTelemetry({ longitude: 76.2144, latitude: 10.5276, accuracy: 100, altitude: 12, speed: 0 });
            }, 3000);
        }

        function updateTelemetry(c) {
            document.getElementById('lon').innerText = c.longitude.toFixed(6) + '° ' + (c.longitude > 0 ? 'E' : 'W');
            document.getElementById('lat').innerText = c.latitude.toFixed(6) + '° ' + (c.latitude > 0 ? 'N' : 'S');
            document.getElementById('acc').innerText = '± ' + (c.accuracy ? Math.round(c.accuracy) : 100) + ' m';
            document.getElementById('ele').innerText = (c.altitude ? Math.round(c.altitude) : 12) + ' m';
            document.getElementById('speed').innerText = (c.speed ? (c.speed * 3.6).toFixed(1) : '0.0') + ' Km/h';
            document.getElementById('digipin').innerText = 'MC2-5M5-548M (Live)';
            calculateSkyData(c.latitude, c.longitude);
        }
        initGPS();

        function activateCompass() {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(response => { if (response == 'granted') startCompass(); }).catch(console.error);
            } else { startCompass(); }
        }
        function startCompass() {
            document.getElementById('compass-icon').style.display = 'block';
            window.addEventListener('deviceorientation', (e) => {
                let heading = e.webkitCompassHeading || Math.abs(e.alpha - 360);
                if(heading) { document.getElementById('heading').innerText = Math.round(heading) + '°'; document.getElementById('compass-icon').style.transform = 'rotate(' + heading + 'deg)'; }
            });
        }

        function calculateSkyData(lat, lon) {
            if (typeof SunCalc === 'undefined') return;
            const now = new Date();
            const sunTimes = SunCalc.getTimes(now, lat, lon);
            const moonTimes = SunCalc.getMoonTimes(now, lat, lon);
            const moonIllum = SunCalc.getMoonIllumination(now);
            const formatTime = (dateObj) => { return dateObj && !isNaN(dateObj) ? dateObj.toLocaleTimeString('en-US', {hour: '2-digit', minute:'2-digit'}) : '--:--'; };

            const phaseValue = moonIllum.phase;
            let phaseName = "";
            if (phaseValue === 0) phaseName = "New Moon";
            else if (phaseValue < 0.25) phaseName = "Waxing Crescent";
            else if (phaseValue === 0.25) phaseName = "First Quarter";
            else if (phaseValue < 0.5) phaseName = "Waxing Gibbous";
            else if (phaseValue === 0.5) phaseName = "Full Moon";
            else if (phaseValue < 0.75) phaseName = "Waning Gibbous";
            else if (phaseValue === 0.75) phaseName = "Last Quarter";
            else phaseName = "Waning Crescent";

            let dayLengthText = "--";
            if (sunTimes.sunset && sunTimes.sunrise) {
                const dayLengthMs = sunTimes.sunset - sunTimes.sunrise;
                if (dayLengthMs > 0) {
                    const hours = Math.floor(dayLengthMs / 3600000);
                    const minutes = Math.floor((dayLengthMs % 3600000) / 60000);
                    dayLengthText = `${hours}h ${minutes}m`;
                }
            }

            document.getElementById('sunrise').innerText = formatTime(sunTimes.sunrise);
            document.getElementById('sunset').innerText = formatTime(sunTimes.sunset);
            document.getElementById('moonrise').innerText = formatTime(moonTimes.rise);
            document.getElementById('moonset').innerText = formatTime(moonTimes.set);
            
            const illumPercent = Math.round(moonIllum.fraction * 100);
            document.getElementById('moonphase').innerText = `${phaseName} (${illumPercent}%)`;
            document.getElementById('daylength').innerText = dayLengthText;
        }

        const events = [
            { date: 'Oct 21, 2026', title: 'Orionids Meteor Shower' },
            { date: 'Nov 17, 2026', title: 'Leonids Meteor Shower' },
            { date: 'Dec 14, 2026', title: 'Geminids Meteor Shower Peak' },
            { date: 'Dec 21, 2026', title: 'Winter Solstice' },
            { date: 'Jan 3, 2027', title: 'Quadrantids Meteor Shower' },
            { date: 'Mar 20, 2027', title: 'Vernal Equinox' },
            { date: 'May 6, 2027', title: 'Eta Aquarids' },
            { date: 'Jun 21, 2027', title: 'Summer Solstice' },
            { date: 'Aug 12, 2027', title: 'Perseids Meteor Shower' }
        ];
        const eventsList = document.getElementById('events-list');
        events.forEach(ev => { eventsList.innerHTML += `<div class="event-item"><span class="event-date">${ev.date}</span> ${ev.title}</div>`; });

        if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js'); }); }
    </script>
</body>
</html>
